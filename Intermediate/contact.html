<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>

<body>

    <header>
        <h1>📞 Contact Us</h1>

        <nav>
            <a href="index.html">Home</a> |
            <a href="products.html">Products</a> |
            <a href="contact.html">Contact</a>
        </nav>

        <hr>
    </header>

    <main>

        <h2>📝 Order Form</h2>

        <form>

            <div>
                <label for="name">Name:</label>

                <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required>
            </div>

            <br>

            <div>
                <label for="email">Email:</label>

                <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>
            </div>

            <br>

            <div>
                <label for="product">Select Product:</label>

                <select id="product" name="product">
                    <option>Shoes</option>
                    <option>Dress</option>
                    <option>Phone</option>
                </select>
            </div>

            <br>

            <div>
                <label for="address">Address:</label>

                <br>

                <textarea
                id="address"
                rows="5"
                cols="40"
                placeholder="Enter your address">
                </textarea>
            </div>

            <br>

            <button type="submit">
                Place Order
            </button>

        </form>

    </main>

    <hr>

    <footer>
        <p>Made by Riya Korani ❤️</p>
    </footer>

</body>
</html>
