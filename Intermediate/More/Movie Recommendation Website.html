<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendation Website</title>
</head>

<body>

    <!-- Header -->

    <header>

        <h1>🎬 Movie Recommendation Website</h1>

        <p>
            Discover top-rated movies with trailers and categories.
        </p>

        <hr>

    </header>

    <!-- Main Content -->

    <main>

        <!-- Movies Table -->

        <table border="1">

            <thead>

                <tr>
                    <th>Poster</th>
                    <th>Movie</th>
                    <th>Category</th>
                    <th>Rating</th>
                    <th>Trailer</th>
                </tr>

            </thead>

            <tbody>

                <!-- Movie 1 -->

                <tr>

                    <td>
                        <img
                        src="https://i.pinimg.com/originals/36/bd/7c/36bd7c8bbdd16c2e9bb3ae331f0e47a9.jpg"
                        alt="Avengers Endgame"
                        height="220"
                        width="150"
                        >
                    </td>

                    <td>Avengers: Endgame</td>

                    <td>Action / Sci-Fi</td>

                    <td>⭐ 9/10</td>

                    <td>

                        <iframe
                        width="300"
                        height="180"
                        src="https://www.youtube.com/embed/TcMBFSGVi1c"
                        title="Avengers Trailer"
                        frameborder="0"
                        allowfullscreen>
                        </iframe>

                    </td>

                </tr>

                <!-- Movie 2 -->

                <tr>

                    <td>
                        <img
                        src="https://tse2.mm.bing.net/th/id/OIP.CgH9BuH7Y18dtgm4t2d2JAHaK-?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
                        alt="Interstellar"
                        height="220">
                    </td>

                    <td>Interstellar</td>

                    <td>Sci-Fi / Drama</td>

                    <td>⭐ 9.5/10</td>

                    <td>

                        <iframe
                        width="300"
                        height="180"
                        src="https://www.youtube.com/embed/zSWdZVtXT7E"
                        title="Interstellar Trailer"
                        frameborder="0"
                        allowfullscreen>
                        </iframe>

                    </td>

                </tr>

                <!-- Movie 3 -->

                <tr>

                    <td>
                        <img
                        src="https://imaginus.ca/cdn/shop/products/71-WBN3FCBL._AC_SL1280_099e0fad-ab37-4aa0-a48f-36515669b323.jpg?v=1642799660"
                        alt="Your Name"
                        height="220">
                    </td>

                    <td>Your Name</td>

                    <td>Anime / Romance</td>

                    <td>⭐ 8.8/10</td>

                    <td>

                        <iframe
                        width="300"
                        height="180"
                        src="https://www.youtube.com/embed/xU47nhruN-Q"
                        title="Your Name Trailer"
                        frameborder="0"
                        allowfullscreen>
                        </iframe>

                    </td>

                </tr>

            </tbody>

        </table>

    </main>

    <hr>

    <!-- Footer -->

    <footer>

        <p>Made by Riya Korani ❤️</p>

    </footer>

</body>
</html>
