<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Homepage Clone</title>
</head>

<body>

    <!-- Header -->

    <header>

        <h1>🎬 NETFLIX</h1>

        <hr>

    </header>

    <!-- Hero Banner -->

    <main>

        <section>

            <h2>Unlimited movies, TV shows and more.</h2>

            <p>
                Watch anywhere. Cancel anytime.
            </p>

            <img
            src="https://images.unsplash.com/photo-1524985069026-dd778a71c7b4"
            alt="Netflix Banner"
            height="350"
            width="700">

        </section>

        <hr>

        <!-- Sign In Form -->

        <section>

            <h2>🔐 Sign In</h2>

            <form>

                <div>

                    <label for="email">Email:</label>

                    <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

                </div>

                <br>

                <div>

                    <label for="password">Password:</label>

                    <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

                </div>

                <br>

                <button type="submit">
                    Sign In
                </button>

            </form>

        </section>

        <hr>

        <!-- Movies Section -->

        <section>

            <h2>🔥 Popular Movies</h2>

            <table>

                <tr>

                    <td>
                        <img
                        src="https://i.pinimg.com/originals/36/bd/7c/36bd7c8bbdd16c2e9bb3ae331f0e47a9.jpg"
                        alt="Avengers Endgame"
                        height="250">
                    </td>

                    <td>
                        <img
                        src="https://alternativemovieposters.com/wp-content/uploads/2020/09/CAMartin_Interstellar.jpg"
                        alt="Interstellar"
                        height="250">
                    </td>

                    <td>
                        <img
                        src="https://www.comingsoon.net/wp-content/uploads/sites/3/2024/09/joker-2-poster.png?resize=91"
                        alt="Joker"
                        height="250">
                    </td>

                </tr>

            </table>

        </section>

    </main>

    <hr>

    <!-- Footer -->

    <footer>

        <p>Made by Riya Korani ❤️</p>

    </footer>

</body>
</html>
