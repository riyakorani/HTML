<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>
</head>

<body>

    <!-- Header -->

    <header>

        <h1>🎥 YouTube Clone</h1>

        <hr>

    </header>

    <!-- Main Layout -->

    <main>

        <!-- Sidebar -->

        <aside>

            <h2>📂 Categories</h2>

            <ul>
                <li>Home</li>
                <li>Trending</li>
                <li>Music</li>
                <li>Gaming</li>
                <li>Education</li>
                <li>Sports</li>
            </ul>

        </aside>

        <hr>

        <!-- Videos Section -->

        <section>

            <h2>🔥 Featured Videos</h2>

            <!-- Video 1 -->

            <article>

                <h3>HTML Tutorial for Beginners</h3>

                <img
                src="https://img.youtube.com/vi/HcOc7P5BMi4/maxresdefault.jpg"
                alt="HTML Tutorial Thumbnail"
                height="220"
                width="400">

                <br><br>

                <iframe
                width="400"
                height="220"
                src="https://www.youtube.com/embed/HcOc7P5BMi4"
                title="HTML Tutorial"
                frameborder="0"
                allowfullscreen>
                </iframe>

            </article>

            <hr>

            <!-- Video 2 -->

            <article>

                <h3>JavaScript Tutorial</h3>

                <img
                src="https://img.youtube.com/vi/lfmg-EJ8gm4/maxresdefault.jpg"
                alt="JavaScript Tutorial Thumbnail"
                height="220"
                width="400">

                <br><br>

                <iframe
                width="400"
                height="220"
                src="https://www.youtube.com/embed/lfmg-EJ8gm4"
                title="JavaScript Tutorial"
                frameborder="0"
                allowfullscreen>
                </iframe>

            </article>

            <hr>

            <!-- Video 3 -->

            <article>

                <h3>CSS Crash Course</h3>

                <img
                src="https://img.youtube.com/vi/ESnrn1kAD4E/maxresdefault.jpg"
                alt="CSS Tutorial Thumbnail"
                height="220"
                width="400">

                <br><br>

                <iframe
                width="400"
                height="220"
                src="https://www.youtube.com/embed/ESnrn1kAD4E"
                title="CSS Tutorial"
                frameborder="0"
                allowfullscreen>
                </iframe>

            </article>

        </section>

    </main>

    <hr>

    <!-- Footer -->

    <footer>

        <p>Made by Riya Korani ❤️</p>

    </footer>

</body>
</html>
